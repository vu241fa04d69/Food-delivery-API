<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <script src="/static/js/main_script.js"></script>
</head>
<body>

<div class="container">

    <h2>User Registration</h2>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="post" action="/auth/register" onsubmit="return validateRegister()">

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Name"
            required
        >

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit" class="btn">
            Register
        </button>

    </form>

    <p class="auth-link">
        Already registered?
        <a href="/login">Login here</a>
    </p>

</div>

</body>
</html>
