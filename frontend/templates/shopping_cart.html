<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <script src="/static/js/main_script.js"></script>
</head>
<body>

<div class="container">

    <h2>Shopping Cart</h2>

    <table>

        <tr>
            <th>Food</th>
            <th>Qty</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>Burger</td>
            <td>2</td>
            <td>300</td>
        </tr>

    </table>

    <br>

    <button
        class="btn"
        onclick="placeOrder()">
        Place Order
    </button>

</div>
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>
<body>

    <h2>Shopping Cart</h2>
    <ul id="cart-items"></ul>

    <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let list = document.getElementById("cart-items");

    cart.forEach(item => {
        let li = document.createElement("li");
        li.textContent = item;
        list.appendChild(li);
    });
    </script>

</body>
</html>

</body>
</html>
