<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <script src="/static/js/main_script.js"></script>
</head>
<body>

<div class="container">

    <h2>User Login</h2>

    {% if message %}
        <p class="success-message">{{ message }}</p>
    {% endif %}

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="post" action="/auth/login" onsubmit="return validateLogin()">

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter Email"
            required
        >

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <p class="auth-link">
        New user?
        <a href="/register">Register here</a>
    </p>

</div>

</body>
</html>
